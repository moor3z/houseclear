# HouseClear — Netlify build configuration
# Netlify's build image includes Python 3; build.py has no pip dependencies.
[build]
  command = "python3 build.py"
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
